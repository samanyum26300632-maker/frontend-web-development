<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seminar Schedule</title>

    <style>
        table {
            border-collapse: collapse;
            width: 700px;
            margin: 30px auto;
            font-family: "Times New Roman", serif;
            font-size: 18px;
        }

        th, td {
            border: 1px solid #777;
            padding: 10px;
            text-align: center;
        }

        th {
            font-weight: bold;
        }

        .day {
            width: 130px;
        }

        .time {
            width: 130px;
        }

        .topic {
            width: 300px;
        }
    </style>
</head>

<body>

<table>
    <tr>
        <th rowspan="3" class="day">Day</th>
        <th colspan="3">Seminar</th>
    </tr>

    <tr>
        <th colspan="2">Schedule</th>
        <th rowspan="2" class="topic">Topic</th>
    </tr>

    <tr>
        <th class="time">Begin</th>
        <th class="time">End</th>
    </tr>

    <tr>
        <td rowspan="2">Monday</td>
        <td rowspan="2">8:00 a.m.</td>
        <td rowspan="2">5:00 p.m.</td>
        <td>Introduction to XML</td>
    </tr>

    <tr>
        <td>Validity: DTD and Relax NG</td>
    </tr>

    <tr>
        <td rowspan="3">Tuesday</td>
        <td>8:00 a.m.</td>
        <td>11:00 a.m.</td>
        <td>XPath</td>
    </tr>

    <tr>
        <td>11:00 a.m.</td>
        <td>2:00 p.m.</td>
        <td>XSL Transformations</td>
    </tr>

    <tr>
        <td>2:00 p.m.</td>
        <td>5:00 p.m.</td>
        <td></td>
    </tr>

    <tr>
        <td>Wednesday</td>
        <td>8:00 a.m.</td>
        <td>12:00 p.m.</td>
        <td>XSL Formatting Objects</td>
    </tr>
</table>

</body>
</html>
